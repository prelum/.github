name: Bug report
description: Something printed wrong, or prelum failed.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting. The smallest file that shows the problem is the most useful thing you can send.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: markdown
    attributes:
      label: Markdown
      description: The smallest Markdown file that shows it, frontmatter included.
      render: markdown
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: npx prelum report.md --theme technical
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Terminal output
      description: Everything prelum printed.
      render: text
  - type: textarea
    id: pdf
    attributes:
      label: Screenshot of the PDF
      description: Drag an image here, for anything that looks wrong.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Output of `npx prelum --version` and `node --version`, plus your OS and browser.
      placeholder: prelum 0.1.0 · Node 24.11 · macOS 26 · Chrome 151
    validations:
      required: true
